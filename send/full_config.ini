[SMTP]
# Server
SERVER = 10.0.0.20
PORT = 25
TIMEOUT = 30

# TLS / SSL
USE_TLS = false
USE_SSL = false

# Addresses  (placeholders — set for YOUR OWN authorized lab)
FROM = it-support@example.local
TO = target-user@example.local

# Message
SUBJECT = System update
BODY_FILE = message.txt
HTA_URL = http://10.0.0.30:8080/update.hta

# Auth — read password from env var instead of storing it here
USERNAME =
PASSWORD_ENV = SMTP_PASSWORD
