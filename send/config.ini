[SMTP]
# Server
SERVER = 10.0.0.20
PORT = 25
TIMEOUT = 30

# TLS / SSL
USE_TLS = false
USE_SSL = false

# Addresses  (placeholders — set for YOUR OWN authorized lab)
FROM = it-support@example.local
TO = target-user@example.local

# Message
SUBJECT = PLS read
BODY_FILE = message.txt
# URL substituted into {hta_url} in the body (your OWN listener in an authorized test)
HTA_URL = http://10.0.0.30:8080/update.hta

# Auth (empty = open relay / no auth)
USERNAME =
PASSWORD =
